{% macro app_store_badge() %}
<a
    class="mkt-store-link"
    href="{{ app_store_url }}"
    data-itms-url="{{ app_store_itms_url }}"
    rel="noopener"
    target="_blank"
>
    <img
        class="mkt-store-badge"
        src="{{ url_for('static', filename='img/store/app-store.svg') }}"
        alt="Download on the App Store"
        width="148"
        height="44"
    >
</a>
{% endmacro %}

{% macro google_play_badge_soon() %}
<span class="mkt-store-soon" aria-label="Google Play listing coming soon">
    <img
        class="mkt-store-badge is-soon"
        src="{{ url_for('static', filename='img/store/google-play.svg') }}"
        alt="Get it on Google Play (coming soon)"
        width="155"
        height="44"
    >
</span>
{% endmacro %}

{% macro store_badges() %}
<div class="mkt-stores is-live" aria-label="Download PlayTracker">
    {{ app_store_badge() }}
    {{ google_play_badge_soon() }}
</div>
{% endmacro %}

{% macro open_in_app_button(app_scheme_url=none) %}
<a
    class="mkt-btn mkt-btn-primary mkt-smart-open"
    href="{{ app_store_url }}"
    data-store-url="{{ app_store_itms_url }}"
    {% if app_scheme_url %}data-app-url="{{ app_scheme_url }}"{% endif %}
>
    Open in PlayTracker
</a>
{% endmacro %}
