<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>{{ code|default(500) }} | Arbel's Stats</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <style>
        :root {
            --bg: #0d1219;
            --bg-2: #151c27;
            --court: #1a2433;
            --ink: #e8eef7;
            --muted: #8b9bb0;
            --aqua: #66cfff;
            --green: #34c759;
            --red: #ff5a5f;
            --sand: #f4d58d;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            background:
                radial-gradient(1200px 600px at 50% -10%, rgba(102, 207, 255, 0.18), transparent 55%),
                radial-gradient(800px 500px at 100% 100%, rgba(52, 199, 89, 0.12), transparent 50%),
                radial-gradient(700px 400px at 0% 80%, rgba(255, 90, 95, 0.10), transparent 45%),
                var(--bg);
            color: var(--ink);
            font-family: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
        }

        .scene {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 20px 48px;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        .net {
            position: absolute;
            top: 42%;
            left: -5%;
            right: -5%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(232, 238, 247, 0.35), transparent);
            opacity: 0.5;
        }

        .net::before,
        .net::after {
            content: "";
            position: absolute;
            top: -18px;
            width: 3px;
            height: 38px;
            background: rgba(232, 238, 247, 0.25);
            border-radius: 2px;
        }

        .net::before { left: 12%; }
        .net::after { right: 12%; }

        .ball-wrap {
            width: 140px;
            height: 140px;
            margin-bottom: 28px;
            animation: float 2.8s ease-in-out infinite;
            filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.45));
        }

        .ball {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background:
                radial-gradient(circle at 30% 28%, #fff6d8 0%, #f0c14b 18%, #e39b2d 42%, #c47a18 70%, #8a5410 100%);
            position: relative;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.15);
            animation: spin 7s linear infinite;
        }

        .ball .seam {
            position: absolute;
            inset: -10%;
            border: 3px solid rgba(40, 28, 12, 0.55);
            border-radius: 50%;
        }

        .ball .seam-1 { transform: rotate(18deg) scaleX(0.55); }
        .ball .seam-2 { transform: rotate(-42deg) scaleY(0.6); left: 8%; }
        .ball .seam-3 { transform: rotate(78deg) scaleX(0.45); top: 10%; }

        .code {
            font-size: clamp(4rem, 18vw, 7rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 0.9;
            margin: 0 0 8px;
            background: linear-gradient(135deg, var(--aqua), #9ae6ff 45%, var(--green));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 40px rgba(102, 207, 255, 0.25);
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 10px;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid rgba(102, 207, 255, 0.35);
            background: rgba(102, 207, 255, 0.08);
            color: var(--aqua);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(1.4rem, 5vw, 2rem);
            font-weight: 750;
        }

        .lead {
            max-width: 28rem;
            margin: 0 auto 28px;
            color: var(--muted);
            font-size: 1.02rem;
            line-height: 1.5;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 44px;
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid transparent;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            transition: transform 0.15s ease, filter 0.15s ease, background 0.15s ease;
        }

        .btn-primary {
            background: var(--aqua);
            color: #082033;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.12);
            color: var(--ink);
        }

        .btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        .court {
            margin-top: 36px;
            width: min(420px, 92vw);
            height: 8px;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent, rgba(102, 207, 255, 0.25), transparent);
            position: relative;
            opacity: 0.8;
        }

        .court span {
            position: absolute;
            left: 50%;
            top: -14px;
            transform: translateX(-50%);
            font-size: 0.7rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--muted);
            white-space: nowrap;
        }

        .detail {
            margin-top: 18px;
            max-width: 36rem;
            color: var(--muted);
            font-size: 0.8rem;
            opacity: 0.75;
            word-break: break-word;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-14px); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .ball-wrap, .ball { animation: none; }
        }
    </style>
</head>
<body>
    <main class="scene">
        <div class="net" aria-hidden="true"></div>

        <div class="ball-wrap" aria-hidden="true">
            <div class="ball">
                <span class="seam seam-1"></span>
                <span class="seam seam-2"></span>
                <span class="seam seam-3"></span>
            </div>
        </div>

        <div class="eyebrow">Out of bounds</div>
        <p class="code">{{ code|default(500) }}</p>
        <h1>{{ title|default("Whiffed that one") }}</h1>
        <p class="lead">{{ message|default("Something spiked the server. The ball is still in play though. Try again or head back to stats.") }}</p>

        <div class="actions">
            <a class="btn btn-primary" href="{{ url_for('index') }}">Back to stats</a>
            <a class="btn btn-secondary" href="javascript:location.reload()">Try again</a>
        </div>

        <div class="court" aria-hidden="true"><span>side out</span></div>

        {% if detail %}
        <p class="detail">{{ detail }}</p>
        {% endif %}
    </main>
</body>
</html>
