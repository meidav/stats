<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PlayTracker{% endblock %}</title>
    <meta name="description" content="PlayTracker: track everything you play. Leagues, standings, and game night in one app.">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/playtracker-logo.svg') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/playtracker-logo.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/marketing.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
    <input type="checkbox" id="mkt-nav-toggle" class="mkt-nav-toggle" hidden>
    <header class="mkt-header">
        <a class="mkt-brand" href="/">
            <img class="mkt-brand-mark" src="{{ url_for('static', filename='img/playtracker-logo.svg') }}" alt="PlayTracker">
            <span class="mkt-tag">Track everything you play</span>
        </a>
        <label for="mkt-nav-toggle" class="mkt-burger" aria-label="Open menu">
            <span></span><span></span><span></span>
        </label>
        <nav class="mkt-nav">
            <label for="mkt-nav-toggle" class="mkt-nav-close" aria-label="Close menu"></label>
            <a class="mkt-nav-link {% block nav_about %}{% endblock %}" href="/about">About</a>
            <a class="mkt-nav-link mkt-nav-login {% block nav_login %}{% endblock %}" href="/login">Login</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="mkt-footer">
        <p class="mkt-copy">
            &copy; {{ current_year }}
            <a href="https://arbelindustries.com" rel="noopener">Arbel Industries</a>
            <span class="mkt-copy-dot">·</span>
            <a href="/privacy">Privacy</a>
            <span class="mkt-copy-dot">·</span>
            <a href="/terms">Terms</a>
        </p>
    </footer>
</body>
</html>
