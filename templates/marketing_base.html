<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{% block title %}PlayTracker{% endblock %}</title>
    <meta name="description" content="PlayTracker: track everything you play. Leagues, standings, and game night in one app.">
    <meta name="theme-color" content="#3b0764">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    {% if app_store_app_id %}
    <meta name="apple-itunes-app" content="app-id={{ app_store_app_id }}">
    {% endif %}
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/brand/playtracker-icon.svg') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/playtracker-logo.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/marketing.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <input type="checkbox" id="mkt-nav-toggle" class="mkt-nav-toggle" hidden>
    <header class="mkt-header">
        <div class="mkt-header-bar">
        <a class="mkt-brand" href="/">
            <img class="mkt-brand-icon" src="{{ url_for('static', filename='img/brand/playtracker-icon.svg') }}" alt="">
            <span class="mkt-brand-copy">
                <span class="mkt-brand-name">PlayTracker</span>
                <span class="mkt-tag">Track everything you play</span>
            </span>
        </a>
        <label for="mkt-nav-toggle" class="mkt-burger" aria-label="Open menu">
            <span></span><span></span><span></span>
        </label>
        <nav class="mkt-nav">
            <label for="mkt-nav-toggle" class="mkt-nav-close" aria-label="Close menu"></label>
            <a class="mkt-nav-link mkt-nav-about {% block nav_about %}{% endblock %}" href="/about">About</a>
            <a class="mkt-nav-link mkt-nav-leagues {% block nav_leagues %}{% endblock %}" href="/leagues">Leagues</a>
            <a class="mkt-nav-link mkt-nav-login {% block nav_login %}{% endblock %}" href="/login">Login</a>
        </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="mkt-footer">
        <p class="mkt-copy">
            &copy; {{ current_year }}
            <a href="https://arbelindustries.com" rel="noopener">Arbel Industries</a>.
            All rights reserved.
            <span class="mkt-copy-dot">·</span>
            <a href="/privacy">Privacy</a>
            <span class="mkt-copy-dot">·</span>
            <a href="/terms">Terms</a>
        </p>
    </footer>
    {% block extra_js %}{% endblock %}
    <script src="{{ url_for('static', filename='js/marketing-store.js') }}" defer></script>
</body>
</html>
